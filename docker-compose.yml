services:
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    image: rentacar-api:local
    container_name: rentacar-migrations
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=RentACarDb;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rentacar-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rentacar-api:local
    container_name: rentacar-api
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=RentACarDb;Username=postgres;Password=postgres
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dotnet", "RentACarApi.dll", "--healthcheck", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - rentacar-network

  postgres:
    image: postgres:16
    container_name: rentacar-postgres
    environment:
      POSTGRES_DB: RentACarDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - rentacar-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d RentACarDb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rentacar-network

volumes:
  rentacar-postgres-data:

networks:
  rentacar-network:
    driver: bridge
