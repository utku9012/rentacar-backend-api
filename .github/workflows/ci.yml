name: CI

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  build-test-and-scan:
    name: Build, Test and Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore RentACarApi.slnx

      - name: Build
        run: dotnet build RentACarApi.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RentACarApi.slnx --configuration Release --no-build --verbosity normal

      - name: Build Docker image
        run: docker build --tag rentacar-api:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rentacar-api:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Gitleaks secret scan
        run: docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --verbose
