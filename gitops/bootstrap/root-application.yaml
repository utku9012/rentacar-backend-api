apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rentacar-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: REPLACE_WITH_GITOPS_REPOSITORY_URL
    targetRevision: main
    path: applications
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
