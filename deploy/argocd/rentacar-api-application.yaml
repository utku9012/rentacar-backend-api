apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rentacar-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-username/rentacar-backend-api.git
    targetRevision: main
    path: deploy/helm/rentacar-api
    helm:
      valueFiles:
        - values-aws.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rentacar
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
