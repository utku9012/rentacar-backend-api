apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rentacar-api-production
  namespace: argocd
  labels:
    app.kubernetes.io/name: rentacar-api
    deployment.environment: production
spec:
  project: rentacar
  sources:
    - repoURL: REPLACE_WITH_GITOPS_REPOSITORY_URL
      targetRevision: main
      path: environments/production
    - repoURL: https://github.com/utku9012/rentacar-backend-api.git
      targetRevision: main
      path: helm/rentacar-api
      helm:
        releaseName: rentacar-api
        valueFiles:
          - values-production.yaml
          - $values/environments/production/values.yaml
    - repoURL: REPLACE_WITH_GITOPS_REPOSITORY_URL
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: rentacar-production
  syncPolicy:
    retry:
      limit: 2
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
