{{- if not .Values.connectionString.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.connectionString.secretName }}
  labels:
    {{- include "rentacar-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.connectionString.key }}: {{ required "connectionString.value is required when existingSecret is not set" .Values.connectionString.value | quote }}
{{- end }}
