replicaCount: 2

image:
  repository: REPLACE_WITH_ECR_REPOSITORY
  tag: REPLACE_WITH_COMMIT_SHA
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

gitops:
  enabled: false
  repository: utku9012/rentacar-backend-api
  commitSha: ""
  syncWaves:
    externalSecret: "-2"
    migration: "-1"
    workload: "0"
    traffic: "1"
    smokeTest: "2"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1654
  runAsGroup: 1654
  fsGroup: 1654
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1654
  runAsGroup: 1654
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: alb
  annotations: {}
  alb:
    enabled: true
    scheme: internet-facing
    targetType: ip
    healthcheckPath: /health/ready
    healthcheckPort: traffic-port
    listenPorts: '[{"HTTP":80}]'
    sslRedirect: ""
    certificateArn: ""
  hosts:
    - host: api-dev.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  enabled: true
  path: /health/live
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /health/ready
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  enabled: true
  path: /health/live
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 24

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60

podDisruptionBudget:
  enabled: false
  minAvailable: ""
  maxUnavailable: 1

config:
  aspNetCoreEnvironment: Production
  applicationName: RentACarApi
  swaggerEnabled: "false"
  metricsEnabled: "true"
  logging:
    default: Information
    microsoftAspNetCore: Warning
  observability:
    serviceName: rentacar-api
    tracingEnabled: "false"
    otlpEndpoint: ""

externalSecrets:
  enabled: false
  secretStoreKind: ClusterSecretStore
  secretStoreName: aws-secrets-manager
  refreshInterval: 1h
  targetSecretName: rentacar-database
  creationPolicy: Owner
  remoteSecretKey: ""
  remoteSecretProperty: ConnectionStrings__DefaultConnection

existingSecret:
  name: rentacar-database
  connectionStringKey: ConnectionStrings__DefaultConnection

migration:
  enabled: true
  useHelmHooks: true
  useArgoHooks: false
  hookDeletePolicy: before-hook-creation,hook-succeeded
  argoHookDeletePolicy: BeforeHookCreation,HookSucceeded
  hookWeight: "-5"
  activeDeadlineSeconds: 300
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

smokeTest:
  enabled: false
  useArgoHook: false
  image: curlimages/curl:8.10.1
  activeDeadlineSeconds: 120
  backoffLimit: 1
  ttlSecondsAfterFinished: 300

networkPolicy:
  enabled: false
  ingressControllerNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
  ingressControllerPodSelector: {}
  allowSameNamespace: true
  allowMonitoring: false
  monitoringNamespaceSelector:
    kubernetes.io/metadata.name: monitoring
  rds:
    enabled: false
    cidr: ""
    port: 5432
  allowExternalHttps: false

serviceMonitor:
  enabled: false
  labels: {}
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  targetLabels:
    - app.kubernetes.io/name
    - app.kubernetes.io/instance

prometheusRule:
  enabled: false
  labels: {}
  rules:
    highErrorRate:
      enabled: true
      threshold: 0.05
      for: 5m
      severity: warning
    highLatency:
      enabled: true
      thresholdSeconds: 1
      for: 5m
      severity: warning
    readinessFailures:
      enabled: true
      for: 5m
      severity: critical

grafanaDashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

terminationGracePeriodSeconds: 30
revisionHistoryLimit: 5
progressDeadlineSeconds: 600
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0
