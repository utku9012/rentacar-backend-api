apiVersion: v1
kind: Service
metadata:
  name: {{ include "rentacar-api.fullname" . }}
  labels:
    {{- include "rentacar-api.labels" . | nindent 4 }}
  {{- if .Values.gitops.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.gitops.syncWaves.workload | quote }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "rentacar-api.selectorLabels" . | nindent 4 }}
