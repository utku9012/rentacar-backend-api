services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rentacar-api
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ApplyMigrationsOnStartup: "true"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=RentACarDb;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: rentacar-postgres
    environment:
      POSTGRES_DB: RentACarDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - rentacar-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d RentACarDb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rentacar-postgres-data:
