{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rentacar-api.serviceAccountName" . }}
  labels:
    {{- include "rentacar-api.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations .Values.gitops.enabled }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.gitops.enabled }}
    argocd.argoproj.io/sync-wave: {{ .Values.gitops.syncWaves.workload | quote }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
