{{- if .Values.externalSecrets.enabled }}
{{- if not .Values.externalSecrets.remoteSecretKey }}
{{- fail "externalSecrets.remoteSecretKey is required when externalSecrets.enabled=true" }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "rentacar-api.fullname" . }}-database
  labels:
    {{- include "rentacar-api.labels" . | nindent 4 }}
  {{- if .Values.gitops.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.gitops.syncWaves.externalSecret | quote }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreKind }}
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ .Values.externalSecrets.targetSecretName }}
    creationPolicy: {{ .Values.externalSecrets.creationPolicy }}
  data:
    - secretKey: {{ .Values.existingSecret.connectionStringKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteSecretKey | quote }}
        property: {{ .Values.externalSecrets.remoteSecretProperty | quote }}
{{- end }}
