apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rentacar-api-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: rentacar-api
    deployment.environment: staging
spec:
  project: rentacar
  sources:
    - repoURL: REPLACE_WITH_GITOPS_REPOSITORY_URL
      targetRevision: main
      path: environments/staging
    - repoURL: https://github.com/utku9012/rentacar-backend-api.git
      targetRevision: main
      path: helm/rentacar-api
      helm:
        releaseName: rentacar-api
        valueFiles:
          - values-staging.yaml
          - $values/environments/staging/values.yaml
    - repoURL: REPLACE_WITH_GITOPS_REPOSITORY_URL
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: rentacar-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
